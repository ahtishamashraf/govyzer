name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  static:
    name: Lint and repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Reject TypeScript sources and dependencies
        run: npm run check:no-typescript
      - name: Reject placeholder and unfinished-work markers
        run: npm run check:placeholders
      - run: npm run lint

  test:
    name: Migrations, unit, integration and API tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: govyzer
          MYSQL_USER: govyzer
          MYSQL_PASSWORD: ci_local_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=ci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_NAME: govyzer
      DATABASE_USER: govyzer
      DATABASE_PASSWORD: ci_local_pw
      DATABASE_SSL: 'false'
      ENCRYPTION_KEY_VERSION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate throwaway secrets for this run
        # Nothing key-shaped is committed to the repository. These values exist
        # only for the lifetime of this job and its disposable database.
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)"
            echo "ENCRYPTION_KEY_V1=$(openssl rand -base64 32)"
            echo "CRON_SECRET=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"
      - name: Run migrations against a disposable database
        run: npm run db:migrate
      - name: Seed reference data
        run: npm run db:seed
      - run: npx vitest run
      - name: Verify OpenAPI matches the live routes
        run: |
          npm --workspace @govyzer/api run openapi
          git diff --exit-code docs/api/openapi.yaml

  build:
    name: Production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --workspace @govyzer/crm-web run build
      - run: npm --workspace @govyzer/sales-screen run build
